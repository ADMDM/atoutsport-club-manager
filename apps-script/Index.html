<script id="startupGuard">
(function () {
  var timer, observer;
  function stop() {
    window.clearTimeout(timer);
    window.removeEventListener('error', showFailure);
    if (observer) observer.disconnect();
  }
  function showFailure() {
    var marker = document.getElementById('startupProgress');
    stop();
    if (!marker) return;
    var area = document.getElementById('authArea');
    if (!area) return;
    var panel = document.createElement('div');
    panel.className = 'login-panel';
    panel.setAttribute('role', 'alert');
    var title = document.createElement('h1');
    title.textContent = 'Chargement interrompu';
    var message = document.createElement('p');
    message.textContent = 'Votre espace ne peut pas se charger pour le moment. Vérifiez votre connexion puis réessayez.';
    var retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'primary';
    retry.textContent = 'Réessayer';
    retry.onclick = function () { window.location.reload(); };
    panel.appendChild(title); panel.appendChild(message); panel.appendChild(retry);
    area.replaceChildren(panel);
  }
  window.addEventListener('error', showFailure);
  timer = window.setTimeout(showFailure, 30000);
  if (window.MutationObserver) {
    observer = new window.MutationObserver(function () {
      if (!document.getElementById('startupProgress')) stop();
    });
    observer.observe(document.getElementById('authArea'), {childList: true, subtree: true});
  }
}());
</script>

function summaryFromLines(){let worked=0,absence=0;for(const l of lines){const m=timeMinute(l.end)-timeMinute(l.start)-Number(l.breakMinutes||0);if(m>0){if(l.type==='ABSENCE')absence+=m;else worked+=m}}return {worked,absence}}
function timeMinute(t){if(!/^\d{2}:\d{2}$/.test(t||''))return NaN;return Number(t.slice(0,2))*60+Number(t.slice(3))}
function lineOriginLabel(line){if(!['REMPLACEMENT','RECUPERATION','RATTRAPAGE_COURS'].includes(line.type)||!line.sourceRef)return '';return /^(?:HORAIRE|PRESENCE|MODIFICATION|REMPLACEMENT):/.test(line.sourceRef)?'Séance indiquée dans le planning':line.sourceRef;}
function markMonthDirty(){dirty=true;const state=$('#saveState');if(state)state.textContent='Modifications à enregistrer.';for(const id of ['saveDraft','submitSheet']){const button=$('#'+id);if(button)button.disabled=busy||id==='submitSheet'&&monthData.canSubmit===false}}
function prestationTone(type){return type==='ABSENCE'?'is-absence':['RECUPERATION','RATTRAPAGE_COURS'].includes(type)?'is-recovery':'';}
function prestationIcon(type){const path=type==='ABSENCE'?'<circle cx="12" cy="12" r="8"/><path d="M8 12h8"/>':['RECUPERATION','RATTRAPAGE_COURS'].includes(type)?'<path d="M4 9a8 8 0 1 1 0 6M4 4v5h5M12 7v5l3 2"/>':'';return path?`<svg class="prestation-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${path}</svg>`:'';}
function prestationLabel(type){return `<span class="prestation-label ${prestationTone(type)}">${prestationIcon(type)}${esc(types[type]||type)}</span>`;}
function prestationTotals(rows){const totals={ABSENCE:0,RECUPERATION:0,RATTRAPAGE_COURS:0};for(const line of rows||[]){if(!Object.prototype.hasOwnProperty.call(totals,line.type))continue;const n=timeMinute(line.end)-timeMinute(line.start)-Number(line.breakMinutes||0);if(Number.isFinite(n)&&n>0)totals[line.type]+=n}return totals;}
function prestationSummary(rows,compact=false){const totals=prestationTotals(rows),items=Object.keys(totals).filter(type=>totals[type]>0);return items.length?`<div class="prestation-summary${compact?' compact':''}" aria-label="Absences et récupérations">${items.map(type=>`<div class="summary-item ${prestationTone(type)}">${prestationLabel(type)}<span class="summary-duration">${duration(totals[type])}</span></div>`).join('')}</div>`:'';}
function prestationEditNotice(type,minutes){const note=type==='ABSENCE'?'Cette plage correspond à une absence non rémunérée.':['RECUPERATION','RATTRAPAGE_COURS'].includes(type)?'Ces heures restent identifiées comme récupération. La direction vérifiera si elles ont déjà été rémunérées.':'';return `${prestationLabel(type)}<p>${minutes>0?'Durée calculée : '+duration(minutes):'Vérifiez les heures et la pause.'}</p>${note?`<p>${note}</p>`:''}`;}
function monthDeadlinePanel(d){const due=d.deadline?dateLabel(d.deadline):'l’avant-dernier jour du mois',correction=d.correctionDeadline?dateLabel(d.correctionDeadline):'le 5 du mois suivant',reminders=Array.isArray(d.reminderDates)?d.reminderDates.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)):[];return `<div class="notice deadline-panel"><div><strong>À envoyer au plus tard ${d.deadline?'le ':''}${esc(due)}.</strong></div><small>Corrections possibles jusqu’au ${d.correctionDeadline?'':'5 du mois suivant'}${d.correctionDeadline?esc(correction):''} inclus, tant que la fiche n’est pas validée.</small><small>${reminders.length?'Rappels prévus les '+reminders.map(x=>esc(dateLabel(x))).join(', ')+'.':'Rappels prévus 7, 3 et 1 jours avant la date limite.'}</small></div>`;}
function homeShortcutHelp(){return '<section class="panel"><details class="shortcut-help"><summary>Ajouter un raccourci à l’écran d’accueil</summary><p><strong>iPhone ou iPad :</strong> ouvrez ce portail dans Safari, puis utilisez <strong>Partager</strong> et <strong>Sur l’écran d’accueil</strong>. Validez avec <strong>Ajouter</strong>.</p><p><strong>Android :</strong> ouvrez le portail dans Chrome, puis son menu et <strong>Ajouter à l’écran d’accueil</strong>. Choisissez <strong>Créer un raccourci</strong> si cette option est proposée.</p><p class="muted">Le raccourci ouvre votre portail en ligne. Une connexion Internet et votre identification restent nécessaires. Si le raccourci n’est pas proposé par votre navigateur, conservez le lien dans vos favoris.</p></details></section>';}
function lineIsForecast(line,d){return typeof d.today==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.today)?line.date>d.today:Array.isArray(d.forecast?.dates)&&d.forecast.dates.includes(line.date);}

function forecastForLines(d,records){const future=(records||[]).filter(l=>lineIsForecast(l,d)),out={lineCount:future.length,workedMinutes:0,absenceMinutes:0,dates:[...new Set(future.map(l=>l.date))].sort()};for(const line of future){const n=timeMinute(line.end)-timeMinute(line.start)-Number(line.breakMinutes||0);if(Number.isFinite(n)&&n>0)out[line.type==='ABSENCE'?'absenceMinutes':'workedMinutes']+=n}return out;}
function forecastNotice(d,records){const f=forecastForLines(d,records),deadline=d.correctionDeadline?dateLabel(d.correctionDeadline):'5 du mois suivant';if(!f.lineCount)return '';return `<div class="notice warning forecast-notice"><strong>Cette fiche contient des plages à venir.</strong><p>${duration(f.workedMinutes)} de prestations prévisionnelles${f.absenceMinutes?' et '+duration(f.absenceMinutes)+' d’absences prévues':''}. Les heures à venir ne sont pas encore effectuées.</p><p>Après les séances, vérifiez les heures et corrigez les changements au plus tard le ${esc(deadline)}, tant que la fiche n’est pas validée.</p></div>`;}
function submissionAvailabilityNotice(d){return d.canEdit===true&&d.canSubmit===false&&d.sheet.status!=='SUBMITTED'?`<div class="notice">Votre brouillon peut être enregistré. L’envoi de cette fiche n’est pas encore ouvert${d.submissionOpensOn?' ; ouverture prévue le '+esc(dateLabel(d.submissionOpensOn)):''}.</div>`:'';}
function submissionConfirmation(d){const f=d.forecast||{},deadline=d.correctionDeadline?dateLabel(d.correctionDeadline):'5 du mois suivant';return d.hasForecast===true?`Envoyer cette fiche à la direction ?\n\nJe confirme les prestations déjà effectuées et je reconnais que ${duration(f.workedMinutes||0)} de prestations${f.absenceMinutes?' et '+duration(f.absenceMinutes)+' d’absences':''} restent prévisionnelles.\n\nJe vérifierai ces plages après les séances et les corrigerai si nécessaire au plus tard le ${deadline}, tant que la fiche n’est pas validée.`:`Confirmer ces heures et envoyer la fiche à la direction ?\n\nJe confirme que cette déclaration correspond à mes prestations. Une correction reste possible jusqu’au ${deadline} inclus, tant que la fiche n’est pas validée.`;}
function monthWorkflowNotice(d){const s=d.sheet,deadline=esc(d.correctionDeadline?dateLabel(d.correctionDeadline):'5 du mois suivant'),receipt=s.submittedAt?`<div class="notice success"><strong>Fiche reçue le ${esc(new Date(s.submittedAt).toLocaleString('fr-BE'))}</strong><br>Version ${Number(s.submissionCount||1)} · ${duration(d.summary.workedMinutes)} déclarées. ${s.status==='APPROVED'?'Cette version est validée.':d.requiresResubmission?'Une nouvelle version doit être envoyée.':'Le récapitulatif envoyé est conservé dans votre fiche.'}${s.forecastAtSubmission?.lineCount?`<p class="forecast-detail">Lors de cet envoi, ${duration(s.forecastAtSubmission.workedMinutes||0)} de prestations${s.forecastAtSubmission.absenceMinutes?' et '+duration(s.forecastAtSubmission.absenceMinutes)+' d’absences':''} étaient prévisionnelles.</p>`:''}${prestationSummary(s.lines||[])}</div>`:'';const correction=d.canCorrectSubmission?`<div class="notice warning">Vous pouvez corriger cette fiche jusqu’au <strong>${deadline} inclus</strong>, tant qu’elle n’est pas validée. Enregistrer une correction la retire du contrôle : pensez à la renvoyer.</div>`:d.requiresResubmission?`<div class="notice warning">Votre correction n’a pas encore été renvoyée. ${d.canEdit?'Vérifiez vos changements, puis utilisez « Renvoyer ma fiche ».':'L’échéance est dépassée. Demandez à la direction de rouvrir la fiche pour correction.'}</div>`:'';return receipt+correction+(d.exists===false&&d.canEdit&&d.hasPlanningBaseline!==false?(d.expected||[]).length?'<div class="notice">Votre planning a été repris automatiquement. Vérifiez chaque plage avant de confirmer l’envoi.</div>':'<div class="notice">Aucune plage n’est prévue dans votre planning ce mois-ci. Ajoutez les prestations réellement effectuées ou confirmez une fiche vide.</div>':'')}
function renderMonth(){const d=monthData,s=d.sheet,editable=d.canEdit===true,own=s.monitorId===actor.monitorId,sum=dirty?{...d.summary,workedMinutes:summaryFromLines().worked,absenceMinutes:summaryFromLines().absence}:d.summary;$('#main').innerHTML=header(own?'Mes prestations':monitorName(s.monitorId),own?'Confirmez vos heures, puis transmettez votre fiche à la direction.':'Vérifiez la déclaration et ses écarts avec le planning.',badge(s.status))+`<div class="toolbar">${monthPicker()}<div class="push month-title">${esc(monthLabel(currentMonth))}</div></div>${monthDeadlinePanel(d)}${sourceModeNotice(d)}${submissionAvailabilityNotice(d)}${s.comment?`<div class="notice ${s.status==='RETURNED'?'warning':''}"><strong>Message de la direction</strong><br>${esc(s.comment)}</div>`:''}${monthMetrics(d,sum,lines)}${prestationSummary(lines)}${forecastNotice(d,lines)}${monthWorkflowNotice(d)}${warningList(d.summary.warnings)}<section class="panel"><div class="panelhead"><h2>${editable?(own?'Votre déclaration':'Déclaration du moniteur'):'Déclaration transmise'}</h2>${editable?`<div class="buttons">${d.hasPlanningBaseline===false?'':'<button id="usePlanning">Reprendre le planning</button>'}<button class="primary" id="addLine">Ajouter une plage</button></div>`:''}</div><div class="statusline">${s.submittedAt?'Envoyée le '+esc(new Date(s.submittedAt).toLocaleString('fr-BE')):d.hasPlanningBaseline===false?'Saisissez les plages de chaque activité pour le mois choisi.':'Les heures piscine sont préremplies. Ajustez-les et ajoutez vos autres activités si nécessaire.'}</div><div class="linecards">${lines.length?lines.map((l,i)=>`<article class="linecard ${prestationTone(l.type)}"><div class="day"><strong>${esc(dateLabel(l.date))}</strong><span class="time">${esc(l.start)} – ${esc(l.end)}</span>${lineForecastBadge(l,d)}</div><div>${prestationLabel(l.type)}<p>${esc(l.activity||'Piscine')}${l.breakMinutes?' · Pause '+esc(l.breakMinutes)+' min':''} · ${duration(timeMinute(l.end)-timeMinute(l. <small id="saveState">${dirty?'Modifications à enregistrer.':s.status==='SUBMITTED'?'Fiche envoyée. Vous pouvez encore la corriger avant l’échéance.':'Brouillon enregistré. Vérifiez toutes les dates avant l’envoi.'}</small><div class="buttons"><button id="saveDraft" ${s.status==='SUBMITTED'&&!dirty?'disabled':''}>${s.status==='SUBMITTED'?'Enregistrer la correction':'Enregistrer le brouillon'}</button><button class="primary" id="submitSheet" ${d.canSubmit===false||s.status==='SUBMITTED'&&!dirty?'disabled':''}>${s.submittedAt?'Renvoyer ma fiche':'Vérifier et envoyer'}</button></div></div>`:''}</section>${d.finance?financePanel(d.finance,s.status):''}${isStaff()&&(!editable||d.canReturn||s.status==='APPROVED')?reviewPanel(s):''}<section class="panel"><h2>${d.hasPlanningBaseline===false?'Déclaration par jour':'Comparaison au planning piscine'}</h2><p class="muted">${dirty?'Cette comparaison correspond au dernier enregistrement. Enregistrez votre brouillon pour actualiser les écarts.':d.hasPlanningBaseline===false?'Les heures sont additionnées par jour, sans comparaison à un planning automatique.':'Les écarts portent sur la piscine. Les autres activités restent comptabilisées séparément.'}</p>${comparisonTable(d.summary.byDate||[],s.lines||[],d)}</section>`;$('#month').onchange=async e=>{if(busy){e.target.value=currentMonth;return}if(!confirmLeave()){e.target.value=currentMonth;return}currentMonth=e.target.value;dirty=false;await go('hours',s.monitorId)};if(editable){$('#declarationNote').oninput=e=>{declarationNote=e.target.value;markMonthDirty()};$('#addLine').onclick=()=>lineDialog();if($('#usePlanning'))$('#usePlanning').onclick=()=>{if(busy)return;if(lines.length&&!window.confirm('Remplacer le brouillon par le planning prévu ?'))return;lines=planningLines(d.expected);dirty=true;renderMonth()};$$('[data-edit]').forEach(b=>b.onclick=()=>lineDialog(Number(b.dataset.edit)));$$('[data-remove]').forEach(b=>b.onclick=()=>{if(busy)return;if(!window.confirm('Retirer cette plage de votre déclaration ? Vous pourrez la rajouter avant l’envoi.'))return;lines.splice(Number(b.dataset.remove),1);dirty=true;renderMonth()});$('#saveDraft').onclick=()=>saveDraft().catch(()=>{});$('#submitSheet').onclick=()=>submitSheet()}$$('[data-review]').forEach(b=>b.onclick=()=>reviewDialog(b.dataset.review));$$('[data-link]').forEach(b=>b.onclick=()=>linkRecovery(lines[Number(b.dataset.link)]));applyBusyControls()}

function openDialog(html,onSubmit){const el=$('#modal');el.innerHTML=html;el.showModal();const form=$('form',el);let saving=false,touched=false;dialogChanged=false;dialogSaving=false;el.onclose=()=>{dialogChanged=false;dialogSaving=false};form?.addEventListener('input',()=>{touched=true;dialogChanged=true});const canClose=()=>!saving&&(!touched||window.confirm('Fermer sans conserver les modifications de ce formulaire ?'));el.oncancel=e=>{if(!canClose())e.preventDefault()};form?.addEventListener('submit',async e=>{e.preventDefault();if(saving)return;saving=true;dialogSaving=true;const fd=new FormData(form),controls=$$('button,input,select,textarea',form),states=controls.map(x=>x.disabled);controls.forEach(x=>x.disabled=true);form.setAttribute('aria-busy','true');const er=$('.dialog-error',el);if(er)er.textContent='';try{await onSubmit(fd,form);touched=false}catch(error){if(er)er.textContent=error.message;else failure(error)}finally{saving=false;dialogSaving=false;controls.forEach((x,i)=>x.disabled=states[i]);form.setAttribute('aria-busy','false')}});$$('[data-cancel]',el).forEach(b=>b.onclick=()=>{if(canClose())el.close()});$('input,select,textarea',el)?.focus()}
function lineDialog(index){if(busy)return;const l=index==null?{date:currentMonth+'-01',start:'09:00',end:'10:00',breakMinutes:0,type:'NORMAL',activity:monthData.hasPlanningBaseline===false?'':'Natation'}:lines[index];openDialog(`<form><h2>${index==null?'Ajouter une plage':'Modifier la plage'}</h2><div class="grid"><div><label for="lineDate">Date</label><input id="lineDate" name="date" type="date" required value="${esc(l.date)}" min="${currentMonth}-01" max="${new Date(Number(currentMonth.slice(0,4)),Number(currentMonth.slice(5)),0).toLocaleDateString('sv-SE')}"></div><div><label for="lineType">Type de prestation</label><select id="lineType" name="type">${Object.entries(types).map(([v,t])=>`<option value="${v}" ${l.type===v?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div><label for="lineStart">Début</label><input id="lineStart" type="time" name="start" required value="${esc(l.start)}"></div><div><label for="lineEnd">Fin</label><input id="lineEnd" type="time" name="end" required value="${esc(l.end)}"></div><div><label for="linePause">Pause non travaillée (minutes)</label><input id="linePause" type="number" min="0" max="720" step="1" name="breakMinutes" value="${Number(l.breakMinutes||0)}" required></div><div><label for="lineActivity">Activité</label><select id="lineActivity" name="activity" required>${activityOptions(l.activity)}</select></div><div id="replacementField" class="full"><label for="replaced">Moniteur remplacé</label><select id="replaced" name="replacedMonitorId">${teamOptions(l.replacedMonitorId,true)}</select></div><div class="full"><label for="lineSource">Cours ou heures d’origine <span id="sourceRequired"></span></label><input id="lineSource" name="sourceRef" maxlength="300" value="${esc(l.sourceRef)}" placeholder="Ex. cours du 12 octobre, 17 h à 18 h"><small>Pour un remplacement ou une récupération, précisez le créneau concerné.</small></div><div class="full"><label for="lineNote">Commentaire facultatif</label><textarea id="lineNote" function profileSavePayload(profile,phone,address,requestId){return {revision:profile.revision,sourceRevision:profile.sourceRevision,phone,address,requestId};}
function renderProfile(){const p=profileData;$('#main').innerHTML=header('Mes coordonnées','Vos informations personnelles pour les démarches administratives.')+`<div class="split"><section class="panel"><div class="panelhead"><h2>Coordonnées personnelles</h2><button id="refreshProfile" class="quiet">Actualiser</button></div>${p.syncMessage?`<div class="notice ${p.syncStatus==='CONFLICT'?'warning':''}">${esc(p.syncMessage)}</div>`:''}${p.editable?`<form id="profileForm"><div class="grid"><div><label for="profileFirst">Prénom</label><input id="profileFirst" value="${esc(p.firstName)}" readonly autocomplete="given-name"></div><div><label for="profileLast">Nom</label><input id="profileLast" value="${esc(p.lastName)}" readonly autocomplete="family-name"></div><div class="full"><label for="profilePhone">Téléphone <span class="muted">(facultatif)</span></label><input id="profilePhone" name="phone" type="tel" maxlength="50" autocomplete="tel" value="${esc(p.phone)}" placeholder="Ex. +32 470 00 00 00"></div><div class="full"><label for="profileAddress">Adresse postale <span class="muted">(facultative)</span></label><textarea id="profileAddress" name="address" maxlength="500" autocomplete="street-address" placeholder="Rue et numéro&#10;Code postal et commune">${esc(p.address)}</textarea></div></div><p class="muted" style="font-size:13px;margin-top:16px">Ces coordonnées sont utilisées dans votre dossier administratif. Pour corriger votre nom, contactez la direction.</p><div class="savebar"><small id="profileSaveState">Vos coordonnées enregistrées sont affichées.</small><button class="primary" type="submit" id="saveProfile" ${p.syncStatus==='PENDING'?'disabled':''}>Enregistrer mes coordonnées</button></div><div id="profileError" class="inline-error" role="alert"></div></form>`:`<p>Ce compte n’est pas associé à une fiche de l’équipe. Votre accès reste <strong>${esc(roles[actor.role])}</strong>.</p>`}</section><div><section class="panel"><h2>Connexion à votre espace</h2><label>Adresse email actuelle</label><p style="overflow-wrap:anywhere">${esc(p.email)}</p><p class="muted" style="font-size:13px">${esc(roles[actor.role])} · Accès personnel</p>${p.pendingEmail?`<div class="notice warning"><strong>Changement en attente</strong><br>${esc(p.pendingEmail.email)}<br>Ouvrez le lien reçu et confirmez votre nouvelle adresse sur la page Google. Revenez ensuite dans cette application, puis utilisez le bouton ci-dessous. Si une reconnexion est demandée, utilisez votre nouvelle adresse.</div><div class="buttons"><button id="checkEmail">J’ai confirmé ma nouvelle adresse</button><button id="resendEmail">Renvoyer le lien</button></div>`:''}${p.editable?`<button id="changeEmail" style="margin-top:12px" ${p.syncStatus==='PENDING'?'disabled':''}>Modifier mon adresse email</button>`:''}<hr><h3>Mot de passe</h3><p class="muted" style="font-size:14px">Recevez un lien personnel pour choisir un nouveau mot de passe.</p><button id="resetPassword">Réinitialiser mon mot de passe</button></section><section class="panel"><h2>Le rendez-vous mensuel</h2><p>Transmettez votre fiche au plus tard <strong>l’avant-dernier jour du mois</strong>. La date exacte est indiquée dans vos prestations.</p><p class="muted" style="font-size:14px">Les rappels sont prévus <strong>7, 3 et 1 jours avant cette date</strong>, tant que la fiche reste à envoyer. Vous pouvez corriger une fiche envoyée jusqu’au <strong>5 du mois suivant inclus</strong>, tant qu’elle n’est pas validée. Les heures restant à effectuer sont identifiées comme prévisionnelles et doivent être vérifiées après les séances. Après l’envoi, vous recevez un récapitulatif.</p>${!bootData.notificationsEnabled?'<div class="notice">Les emails sont actuellement désactivés. Consultez directement votre espace.</div>':''}</section>${homeShortcutHelp()}</div></div>${actor.monitorId?'<section id="identityPanel" class="panel"></section>':''}`;$('#refreshProfile').onclick=()=>go('profile');if(p.editable){$('#profileForm').oninput=()=>{dirty=true;profileSaveId='';$('#profileSaveState').textContent='Modifications à enregistrer.'};$('#profileForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const phone=$('#profilePhone').value,address=$('#profileAddress').value;profileSaveId=profileSaveId||crypto.randomUUID();setBusyState(true);try{profileData=await api('saveProfile',profileSavePayload(p,phone,address,profileSaveId));dirty=false;renderProfile();notify(profileData.syncStatus==='SYNCED'?'Coordonnées enregistrées.':'Coordonnées enregistrées ; consultez le suivi de synchronisation.')}catch(error){$('#profileError').textContent=error.message;failure(error)}finally{setBusyState(false)}};$('#changeEmail').onclick=()=>{if(busy||!confirmLeave())return;dirty=false;renderProfile();emailChangeDialog()}}$('#resetPassword').onclick=async e=>{if(busy)return;const b=e.currentTarget;b.disabled=true;try{if(window.PORTAL_DEMO_BRIDGE)return notify('Démonstration : aucun email envoyé.');await sdk.sendPasswordResetEmail(auth,actor.email);notify('Le lien de réinitialisation a été demandé.')}catch(error){failure(new Error(authError(error)))}finally{b.disabled=false}};if(p.pendingEmail){$('#checkEmail').onclick=confirmProfileEmail;$('#resendEmail').onclick=()=>{if(busy||!confirmLeave())return;dirty=false;renderProfile();emailChangeDialog(p.pendingEmail.email)}}applyBusyControls();if(actor.monitorId)loadIdentityPanel(actor.monitorId)}
async function verifyProfileEmail(email,password){const user=auth.currentUser;if(password){const credential=sdk.EmailAuthProvider.credential(user.email,password);await sdk.reauthenticateWithCredential(user,credential)}await sdk.verifyBeforeUpdateEmail(user,email);}
function emailChangeDialog(existingEmail=''){let reservation=null,requestId=crypto.randomUUID(),lastEmail='';openDialog(`<form><h2>Modifier mon adresse email</h2><p class="muted">Votre nouvelle adresse doit être vérifiée avant de devenir votre identifiant de connexion.</p><label for="newEmail">Nouvelle adresse email</label><input id="newEmail" name="email" type="email" autocomplete="email" required maxlength="254" value="${esc(existingEmail)}"><div id="recentPassword" hidden style="margin-top:18px"><label for="confirmPassword">Confirmez votre mot de passe actuel</label><input id="confirmPassword" name="password" type="password" autocomplete="current-password"><small>La confirmation est transmise uniquement au service de connexion.</small></div><div class="notice">Un lien sera envoyé à la nouvelle adresse. Confirmez-la sur la page de vérification Google, puis revenez ici et choisissez « J’ai confirmé ma nouvelle adresse ». Si la connexion a expiré, reconnectez-vous avec cette nouvelle adresse.</div><div class="dialog-error inline-error" role="alert"></div><div class="buttons"><button type="button" data-cancel>Annuler</button><button class="primary" type="submit">Envoyer le lien de vérification</button></div></form>`,async fd=>{const email=String(fd.get('email')||'').trim().toLowerCase();if(window.PORTAL_DEMO_BRIDGE){notify('Démonstration : aucune adresse modifiée, aucun email envoyé.');$('#modal').close();return}if(email!==lastEmail){reservation=null;requestId=crypto.randomUUID();lastEmail=email}if(!reservation){reservation=await api('requestProfileEmail',{revision:profileData.revision,email,requestId});profileData=reservation}try{await verifyProfileEmail(email,String(fd.get('password')||''))}catch(error){$('#confirmPassword').value='';if(error.code==='auth/requires-recent-login'){$('#recentPassword').hidden=false;$('#confirmPassword').required=true;throw new Error('Pour confirmer ce changement, saisissez votre mot de passe actuel puis réessayez.')}throw new Error(authError(error))}$('#confirmPassword').value='';$('#modal').close();renderProfile();notify('Lien de vérification envoyé à '+email+'. Ouvrez-le pour confirmer le changement.');});}
async function confirmProfileEmail(){if(busy||!confirmLeave())return;if(window.PORTAL_DEMO_BRIDGE)return notify('Démonstration : aucune vérification réelle effectuée.');setBusyState(true);try{await sdk.reload(auth.currentUser);await auth.currentUser.getIdToken(true);const result=await api('completeProfileEmail');if(result.actor)actor=result.actor;dirty=false;await showProfile();$('#accountName').textContent=actor.name||actor.email;notify(result.completed?'Nouvelle adresse vérifiée et enregistrée.':'La vérification n’est pas encore terminée. Ouvrez le lien reçu à la nouvelle adresse.')}catch(error){failure(new Error(authError(error)))}finally{setBusyState(false)}}
async function showDiagnostic(){const d=await api('diagnostic'),mail=isDirector()?await api('mailLog'):null;$('#main').innerHTML=header('État du service','Configuration et suivi des notifications.')+`<section class="panel"><div class="panelhead"><h2>Configuration du portail</h2><button id="refreshDiag">Actualiser</button></div><div class="metrics"><div class="metric"><span>Connexion</span><strong>${d.configured?'Prête':'À configurer'}</strong></div><div class="metric"><span>Emails</span><strong>${d.notificationsEnabled?'Activés':'Désactivés'}</strong></div><div class="metric"><span>En attente</span><strong>${Number(d.pending||0)}</strong></div><div class="metric"><span>À vérifier</span><strong>${Number(d.failed||0)}</strong></div></div><p class="muted">Version ${esc(d.version)} · ${Number(d.poolMonitors||0)} moniteurs piscine · Sources consultées ${esc(d.sourceCheckedAt||'')}</p><div class="notice">Cet espace est indépendant du lecteur TV. Aucun réglage du Raspberry n’est modifié ici.</div></section>${mail?`<section class="panel"><h2>Notifications email</h2><p class="muted">En cas d’état incertain, vérifiez l’envoi avant de relancer pour éviter un doublon.</p><div class="tablewrap"><table><thead><tr><th>Destinataire et objet</th><th>État</th><th></th></tr></thead><tbody>${(mail.rows||[]).map(m=>`<tr><td><strong>${esc(m.to)}</strong><small>${esc(m.subject)}</small>${m.error?`<small>${esc(m.error)}</small>`:''}</td><td>${esc(({PENDING:'En attente',SENDING:'En cours',SENT:'Envoyé',FAILED:'Échec à vérifier',UNKNOWN:'Envoi incertain'})[m.status]||m.status)}</td><td>${['FAILED','UNKNOWN'].includes(m.status)?`<button class="rowaction" data-retrymail="${esc(m.id)}">Relancer après vérification</button>`:''}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Aucune notification enregistrée.</td></tr>'}</tbody></table></div></section>`:''}`;$('#refreshDiag').onclick=()=>go('diagnostic');$$('[data-retrymail]').forEach(b=>b.onclick=()=>{const m=mail.rows.find(x=>x.id===b.dataset.retrymail);openDialog(`<form><h2>Relancer la notification</h2><p>${esc(m.to)} · ${esc(m.subject)}</p><label for="retryReason">Vérification effectuée / motif</label><textarea id="retryReason" name="reason" required maxlength="500" placeholder="Ex. Le destinataire confirme ne pas avoir reçu le message."></textarea><div class="dialog-error inline-error" role="alert"></div><div class="buttons"><button type="button" data-cancel>Annuler</button><button class="primary" type="submit">Remettre en file d’envoi</button></div></form>`,async fd=>{await api('retryMail',{id:m.id,revision:m.revision,reason:fd.get('reason')});$('#modal').close();await showDiagnostic();notify('Notification remise en attente.')})})}
async function showAdministration(target={}){if(!isStaff())throw new Error('Accès administratif réservé.');const r=await api('legacyUi');if(page!=='administration')return;$('#main').innerHTML=header('Équipe et gestion','Ouvrez une personne pour retrouver son planning, ses tarifs et ses documents.')+'<iframe id="legacyFrame" title="Administration AtoutSport" sandbox="allow-scripts allow-forms allow-downloads" style="display:block;width:100%;height:82vh;border:1px solid var(--line);border-radius:12px;background:white"></iframe>';const frame=$('#legacyFrame');frame.dataset.nonce=crypto.randomUUID();frame.onload=()=>frame.contentWindow.postMessage({type:'atout-init',nonce:frame.dataset.nonce,target:{monitorId:typeof target.monitorId==='string'?target.monitorId:'',month:/^20\d\d-(0[1-9]|1[0-2])$/.test(target.month||'')?target.month:currentMonth,table:'MONITEURS'}},'*');legacyBusy=false;frame.srcdoc=r.html}
window.addEventListener('message',async event=>{const frame=$('#legacyFrame'),m=event.data;if(!frame||event.source!==frame.contentWindow||event.origin!=='null'||!m||m.nonce!==frame.dataset.nonce||!isStaff())return;if(m.type==='atout-state'){dirty=m.dirty===true;legacyBusy=m.busy===true;return}if(m.type==='atout-navigate'){if(!['identity','hours','recoveries'].includes(m.target)||!(people.length?people:team).some(p=>p.id===m.monitorId))return;if(/^20\d\d-(0[1-9]|1[0-2])$/.test(m.month||''))currentMonth=m.month;dossierContext={monitorId:m.monitorId};await go({identity:'teamProfiles',hours:'hours',recoveries:'recoveries'}[m.target],m.monitorId);return}if(m.type!=='atout-request'||typeof m.id!=='string'||typeof m.method!=='string'||!Array.isArray(m.args))return;try{const data=await api('legacy',{method:m.method,args:m.args});frame.contentWindow.postMessage({type:'atout-response',nonce:m.nonce,id:m.id,ok:true,data},'*')}catch(error){frame.contentWindow.postMessage({type:'atout-response',nonce:m.nonce,id:m.id,ok:false,error:error.message||'Action impossible.'},'*')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)forgetIdentityReveal()});
window.addEventListener('DOMContentLoaded',start);
</script>
