    }
    if(n.matches('summary'))return {label:raw,description:'Déplie ou replie les informations et les options de cette rubrique.'};
    if(n.classList.contains('person-link'))return {label:'Ouvrir le dossier',description:actions['Ouvrir le dossier']};
    if(/^Aperçu de /.test(raw))return {label:'Aperçu de la slide',description:actions.Aperçu};
    if(/^(Monter|Descendre) /.test(raw))return {label:raw.split(' ')[0]+' la slide',description:'Déplace la slide dans l’ordre de diffusion. Choisissez Toutes et videz la recherche pour réorganiser la liste.'};
    if(/^Fermer/.test(raw))return {label:raw,description:actions.Fermer};
    if(/^Retour (aux paiements|à l’équipe)/.test(raw))return {label:raw,description:'Revient à la liste depuis laquelle vous avez ouvert ce dossier.'};
    if(n.id==='quickConfirm')return {label:raw,description:'Exécute l’action décrite dans la fenêtre de confirmation. Relisez ce message avant de confirmer.'};
    if(raw==='Retirer' && n.closest('#uploadSummary'))return {label:raw,description:'Retire le fichier sélectionné dans ce formulaire avant son enregistrement. Aucun horaire n’est modifié.'};
    if(n.id==='add' || /^Ajouter (un |une )/.test(raw) || /^Créer (un |une )/.test(raw))return {label:raw,description:actions[raw] || 'Ouvre un formulaire pour ajouter un élément dans « '+(pages[ctx.key]?.[0] || ctx.title)+' ». L’ajout est appliqué après enregistrement.'};
    if(raw==='Annuler' && ctx.key==='PAIEMENTS' && !ctx.isForm)return {label:raw,description:'Annule cette écriture de paiement après confirmation. Elle reste dans l’historique et ne participe plus au solde.'};
    if(raw==='Annuler' && ctx.key==='AJUSTEMENTS' && !ctx.isForm)return {label:raw,description:'Annule cette correction après confirmation. L’historique reste conservé et les minutes sont retirées du calcul.'};
    if(raw==='Restaurer' && ctx.key==='ARCHIVES')return {label:raw,description:'Restaure cet horaire archivé après confirmation. Il participe de nouveau au planning.'};
    if(actions[raw])return {label:raw,description:actions[raw]};
    if(links[raw])return {label:raw,description:'Ouvre la rubrique '+pages[links[raw]][0]+'. '+pages[links[raw]][1]};
    if(typeof DAYS!=='undefined' && DAYS.includes(raw))return {label:raw,description:'Affiche les horaires du '+raw.toLowerCase()+'.'};
    if(n.hasAttribute('aria-pressed'))return {label:raw,description:'Sélectionne ce filtre ou cette option. La sélection actuelle est indiquée visuellement.'};
    if(n.matches('a'))return {label:raw,description:'Ouvre le document ou la ressource indiquée par ce lien.'};
    return {label:raw,description:'Commande « '+raw+' » du formulaire ou de la page. Vérifiez les indications affichées à proximité avant de l’utiliser.'};
  }
  function entries(root,ctx) {
    const seen=new Set(),out=[];
    for(const n of root.querySelectorAll('button,a[href],input:not([type="hidden"]),select,textarea,summary')) {
      if(own(n) || n.dataset.adminHelp!==undefined || !visible(n))continue;
      const e=explain(n,ctx);if(!e.label)continue;
      const key=e.label+'|'+e.description+'|'+!!n.disabled;
      if(seen.has(key))continue;seen.add(key);
      out.push({...e,target:n,disabled:!!n.disabled,reason:n.disabled?clean(n.title):''});
    }
    return out;
  }
  function sourceDialog() {return [...document.querySelectorAll('dialog[open]')].filter(n=>!own(n)&&n.id!=='more').pop();}
  function open(root,trigger) {
    if(tour?.open)stopTour(false);
    root=root || sourceDialog() || document.getElementById('main');
    if(!root)return;
    const ctx=context(root);
    session={root,ctx,trigger:trigger || document.activeElement,entries:entries(root,ctx),scroll:[]};
    const help=document.getElementById('help'),body=help.querySelector('.help-body');
    document.getElementById('helptitle').textContent='Aide · '+ctx.title;
    body.replaceChildren();
    const intro=node('section',undefined,'admin-help-intro'),actionsBar=node('div',undefined,'admin-help-actions');
    intro.append(node('h3','À quoi sert cette page ?'),node('p',ctx.description));
    intro.append(node('p','Le guide vous montre les commandes sans les activer. Vous pouvez le quitter à tout moment et reprendre votre saisie.','small muted'));
    actionsBar.append(control('Faire le tour de cette page',()=>startTour(), 'btn primary'),control('Reprendre ma page',()=>help.close()));
    intro.append(actionsBar);body.append(intro);
    const how=node('section');how.append(node('h3','Comment l’utiliser'));const steps=node('ol',undefined,'admin-help-steps');ctx.steps.forEach(s=>steps.append(node('li',s)));how.append(steps);body.append(how);
    const catalog=node('section',undefined,'admin-help-catalog');catalog.append(node('h3',ctx.isForm?'Les champs et les boutons':'Les boutons et les filtres de cette page'));
    for(const entry of session.entries){
      const row=node('article',undefined,'admin-help-entry');row.append(node('h3',entry.label),node('p',entry.description));
      if(entry.disabled)row.append(node('p','Indisponible actuellement'+(entry.reason?' : '+entry.reason:'. La disponibilité dépend des données, de la période ou de vos droits.'),'admin-help-status'));
      row.append(control('Me montrer « '+entry.label+' »',()=>startTour(entry.target),'btn quiet'));catalog.append(row);
    }
    if(!session.entries.length)catalog.append(node('p','Aucune commande chargée pour le moment. Fermez puis rouvrez l’aide après le chargement.'));
    body.append(catalog);
    if(!help.open)help.showModal();
    body.scrollTop=0;actionsBar.querySelector('button').focus();
  }
  function rememberScroll(root){
    const nodes=new Set([document.scrollingElement,root,...root.querySelectorAll('*')]);
    return [...nodes].filter(n=>n && (n.scrollTop||n.scrollLeft||n.scrollHeight>n.clientHeight)).map(n=>[n,n.scrollTop,n.scrollLeft]);
  }
  function ensureTour(){
    if(tour)return;
    tour=node('dialog');tour.id='adminHelpTour';tour.setAttribute('aria-labelledby','adminTourTitle');tour.setAttribute('aria-describedby','adminTourText');
    const ring=node('div',undefined,'admin-tour-ring');ring.setAttribute('aria-hidden','true');
    const card=node('section',undefined,'admin-tour-card'),progress=node('p',undefined,'admin-tour-progress');progress.id='adminTourProgress';progress.setAttribute('aria-live','polite');
    const title=node('h2');title.id='adminTourTitle';title.tabIndex=-1;
    const text=node('p');text.id='adminTourText';
    const foot=node('div',undefined,'admin-tour-footer'),back=control('Précédent',()=>move(-1)),next=control('Suivant',()=>move(1),'btn primary');back.id='adminTourBack';next.id='adminTourNext';foot.append(back,next);
    card.append(progress,title,text,foot,control('Quitter le guide',()=>stopTour(),'admin-tour-stop'));tour.append(ring,card);document.body.append(tour);
    tour.addEventListener('cancel',e=>{e.preventDefault();stopTour()});
    tour.addEventListener('close',()=>finishTour());
    tour.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});
    for(const event of ['resize','scroll'])window.addEventListener(event,()=>{if(tour.open){cancelAnimationFrame(frame);frame=requestAnimationFrame(position)}},true);
  }
  function startTour(target){
    if(!session?.root.isConnected)return;
    session.entries=entries(session.root,session.ctx);
    const heading=session.root.querySelector(session.ctx.isForm?'h2':'#title');
    session.steps=[{label:session.ctx.title,description:session.ctx.description,target:heading},...session.entries];
    session.index=target?Math.max(0,session.steps.findIndex(s=>s.target===target)):0;
    session.scroll=rememberScroll(session.root);
    ensureTour();document.getElementById('help').close();tour.showModal();renderStep();
  }
  function move(delta){
    if(!tour?.open||!session)return;
    let i=session.index+delta;
    while(i>=0 && i<session.steps.length && !visible(session.steps[i].target))i+=delta;
    if(i>=session.steps.length){stopTour();return}if(i<0)return;
    session.index=i;renderStep();
  }
  function renderStep(){
    const item=session.steps[session.index],available=visible(item.target);
    document.getElementById('adminTourProgress').textContent='Étape '+(session.index+1)+' sur '+session.steps.length;
    const title=document.getElementById('adminTourTitle');title.textContent=item.label;
    document.getElementById('adminTourText').textContent=item.description+(item.disabled?' Ce bouton est actuellement indisponible.'+(item.reason?' '+item.reason:''):'')+(!available?' Cet élément n’est plus affiché ; passez à l’étape suivante.':'');
    document.getElementById('adminTourBack').disabled=session.index===0;
    document.getElementById('adminTourNext').textContent=session.index===session.steps.length-1?'Terminer':'Suivant';
    if(available)item.target.scrollIntoView({block:'center',inline:'nearest',behavior:'auto'});
    position();title.focus({preventScroll:true});
  }
  function position(){
    if(!tour?.open||!session)return;
    const item=session.steps[session.index],ring=tour.querySelector('.admin-tour-ring'),card=tour.querySelector('.admin-tour-card');
    const width=window.innerWidth,height=window.innerHeight;
    let r=visible(item.target)?item.target.getBoundingClientRect():null;
    if(r && (r.bottom<0||r.top>height||r.right<0||r.left>width))r=null;
    const x=r?Math.max(5,r.left-5):width/2,y=r?Math.max(5,r.top-5):height/3,w=r?Math.max(0,Math.min(width-5,r.right+5)-x):0,h=r?Math.max(0,Math.min(height-5,r.bottom+5)-y):0;
    Object.assign(ring.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderWidth:r?'3px':'0'});
    const cw=Math.min(width-32,410),ch=card.getBoundingClientRect().height;
    let top=r && r.bottom+ch+24<height?r.bottom+16:r && r.top-ch-24>0?r.top-ch-16:Math.max(12,height-ch-16);
    let left=Math.max(12,Math.min(width-cw-16,r?r.left:((width-cw)/2)));
    if(width<=560){left=12;top=r && r.top>ch+24?12:Math.max(12,height-ch-12)}
    Object.assign(card.style,{left:left+'px',top:top+'px',bottom:'auto'});
  }
  function finishTour(){
    cancelAnimationFrame(frame);
    if(!session)return;
    for(const [n,top,left] of session.scroll||[])if(n.isConnected){n.scrollTop=top;n.scrollLeft=left;}
    session.scroll=[];
    if(session.trigger?.isConnected && visible(session.trigger))session.trigger.focus({preventScroll:true});
  }
  function stopTour(){if(tour?.open)tour.close();}
  function injectFormHelp(){
    for(const d of document.querySelectorAll('dialog[open]')){
      if(own(d)||['more','discard'].includes(d.id)||d.querySelector('[data-admin-help]'))continue;
      const head=d.querySelector('.dialog-head') || d.querySelector('.form-scroll');if(!head)continue;
      const b=control('Aide',()=>open(d,b),'btn admin-help-form-button');b.dataset.adminHelp='';b.setAttribute('aria-label','Aide de ce formulaire');head.append(b);
    }
  }
  // The historical video editor and bootstrap still resolve these references
  // by ID. Keep the original nodes available when replacing the general help.
  const references=node('div');references.hidden=true;
  for(const id of ['mediaFolderLink','sheetlink']){const link=document.getElementById(id);if(link)references.append(link);}
  document.body.append(references);
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='helpButton' || (b.closest('#moremenu') && clean(b.textContent)==='Aide')){
      e.preventDefault();e.stopImmediatePropagation();const more=document.getElementById('more');if(more.open)more.close();open(null,b);
    }
  },true);
  document.getElementById('help').addEventListener('close',()=>{
    // Native dialogs keep their original form open. Focus restoration never
    // clicks a control and never modifies the application dirty state.
    if(!tour?.open && session?.trigger?.isConnected && visible(session.trigger))session.trigger.focus({preventScroll:true});
  });
  new MutationObserver(injectFormHelp).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['open']});
  injectFormHelp();
  return {open,context,entries,explain,pages};
})();
</script>
